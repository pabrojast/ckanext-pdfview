{% set pdf_url = resource_view.get('pdf_url') or resource.get('url') %}

<div id="pdf-viewer-container" style="position:relative; min-height:100vh; width:100%;">
    <iframe 
        id="pdf-viewer-iframe"
        src="{{ h.url_for('/', _external=True) }}pdfjs/web/viewer.html?file={{ pdf_url }}?preview=1" 
        style="margin:auto; max-height:100%; min-height:100vh; min-width:100%; display:block;" 
        frameborder="0" 
        allowfullscreen>
    </iframe>

    <div id="pdf-viewer-fallback" style="display:none; text-align:center; padding:60px 20px; min-height:100vh; background:#f9f9f9;">
        <div style="max-width:460px; margin:0 auto;">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:20px;">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <h3 style="color:#555; margin-bottom:10px; font-size:1.3em;">{{ _('Preview not available') }}</h3>
            <p style="color:#888; margin-bottom:24px; line-height:1.5;">
                {{ _('The PDF document cannot be previewed at this time. You can download it directly using the button below.') }}
            </p>
            <a href="{{ pdf_url }}" 
               target="_blank" 
               style="display:inline-block; padding:12px 28px; background:#0073e6; color:#fff; text-decoration:none; border-radius:4px; font-size:1em;">
                {{ _('Download PDF') }}
            </a>
        </div>
    </div>
</div>

<script>
(function() {
    var pdfUrl = "{{ pdf_url }}";
    var iframe = document.getElementById('pdf-viewer-iframe');
    var fallback = document.getElementById('pdf-viewer-fallback');

    // Test if the PDF URL is accessible
    fetch(pdfUrl, { method: 'HEAD', mode: 'cors' })
        .then(function(response) {
            if (!response.ok) {
                showFallback();
            }
        })
        .catch(function() {
            showFallback();
        });

    function showFallback() {
        iframe.style.display = 'none';
        fallback.style.display = 'block';
    }
})();
</script>
